# Fork only: not for upstream. Tests and publishes the controller and Codex
# harness images that jomcgi-org/homelab pins by digest while its Codex
# bump waits for an upstream kagent release.
name: jomcgi images

on:
  push:
    branches: ["jomcgi/**"]
  workflow_dispatch: {}

concurrency:
  group: jomcgi-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
      with:
        go-version-file: go/go.mod
        cache-dependency-path: go/go.sum
    - name: Test the Codex harness and its compiler
      working-directory: go
      run: go test ./harness/codex/... ./core/internal/translator/codex/...

  push-images:
    needs: test
    strategy:
      matrix:
        image: [controller, codex-harness]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      with:
        version: v0.23.0
        use: 'true'
    # The factory nodes are amd64 only.
    - name: Build and push
      env:
        IMAGE: ${{ matrix.image }}
        DOCKER_BUILDER: docker buildx build
        DOCKER_BUILD_ARGS: --push --platform linux/amd64
        DOCKER_REGISTRY: ghcr.io
        DOCKER_REPO: jomcgi-org/kagent
        RUNTIME_IMAGE_METADATA_DIR: ${{ runner.temp }}
      run: |
        VERSION="1.0.1-jomcgi.$(git rev-parse --short=12 HEAD)"
        make "build-$IMAGE" VERSION="$VERSION"
        docker buildx imagetools inspect "ghcr.io/jomcgi-org/kagent/$IMAGE:$VERSION" --format '{{json .Manifest.Digest}}' \
          | tee -a "$GITHUB_STEP_SUMMARY"
